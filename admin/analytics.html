<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Analytics & Statistiques — JLODNA Plas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
.an{max-width:1200px;margin:0 auto;padding:16px}.an-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:12px 0}.an-bar>div{flex:1 1 140px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.kpi{border:1px solid var(--g100);border-radius:var(--r);padding:12px}.kpi b{display:block;font-size:1.4rem}.kpi small{color:var(--g500)}
.an h2{margin:26px 0 8px;border-left:5px solid var(--orange);padding-left:10px}.bar{height:10px;border-radius:5px;background:var(--orange);min-width:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--g100);white-space:nowrap}th{background:var(--g50)}tr.clk{cursor:pointer}tr.clk:hover{background:#FFF3E6}
.note{font-size:.8rem;color:var(--g500)}.fun div{display:flex;gap:10px;align-items:center;margin:6px 0}.fun span{min-width:150px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<div class="an" id="root"><h1 style="font-size:1.8rem">Analytics &amp; Statistiques</h1><p class="note"><a href="/admin/">← Retour à l'administration</a></p>
<div class="an-bar">
<div><label for="range">Période</label><select id="range"><option value="today">Aujourd'hui</option><option value="yesterday">Hier</option><option value="7" selected>7 derniers jours</option><option value="30">30 derniers jours</option><option value="90">90 derniers jours</option><option value="month">Ce mois</option><option value="prev">Mois précédent</option><option value="custom">Personnalisée</option></select></div>
<div id="cust" hidden style="display:none;gap:8px"><div><label for="d1">Du</label><input id="d1" type="date"></div><div><label for="d2">Au</label><input id="d2" type="date"></div></div>
<div><label for="fsrc">Source</label><select id="fsrc"><option value="">Toutes</option></select></div>
<div><label for="fdev">Appareil</label><select id="fdev"><option value="">Tous</option><option>android</option><option>iphone</option><option>tablette</option><option>ordinateur</option><option>mobile</option></select></div>
<div style="flex:0 0 auto"><button class="btn primary" id="go">Actualiser</button> <button class="btn" id="csv">Export CSV</button></div></div>
<p id="msg" class="err-msg" role="alert"></p><div id="out"><p class="muted">Chargement…</p></div></div>
<script type="module" src="/admin/js/analytics.js"></script></body></html>
